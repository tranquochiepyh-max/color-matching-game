<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matching Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Matching Game</h1>
    
    <h2 id="character-name-display" style="color: #007BFF; text-transform: capitalize; margin-bottom: 20px;">Đang tải nhân vật...</h2>

    <div class="image-container">
        <!-- Cột 1: Ảnh gốc (Đáp án) -->
        <div class="box" id="original-box" style="display: none;">
            <h2>Đáp án chính xác</h2>
            <img src="" id="target-img" alt="Ảnh gốc">
        </div>

        <!-- Cột 2: Ảnh nhân vật trong game -->
        <div class="box">
            <h2>Đáp án của bạn</h2>
            <div id="character-wrapper">
                <img src="" id="body-img" alt="Thân nhân vật">
                <img src="" id="shirt-img" alt="Áo nhân vật">
                <div id="color-overlay"></div>
            </div>
        </div>
    </div>

    <!-- Bảng điều khiển (Sẽ bị ẩn sau khi chấm điểm) -->
    <div class="controls" id="controls-panel">
        <h3>Hãy chọn màu chính xác cho nhân vật</h3>

        <div>
            <label>Chọn Màu Nhanh:</label>
            <input type="color" id="quick-color" value="#ffffff">
        </div>

        <div>
            <label>Màu sắc (Hue):</label>
            <input type="range" id="hue" min="0" max="360" value="0">
        </div>

        <div>
            <label>Độ rực rỡ (Saturation):</label>
            <input type="range" id="saturation" min="0" max="100" value="0">
        </div>

        <div>
            <label>Độ sáng (Brightness):</label>
            <input type="range" id="brightness" min="0" max="100" value="100">
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button id="check-btn">Chấm Điểm</button>
        <button id="next-btn" style="display: none; background-color: #007BFF; margin-left: 10px; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Chơi lại</button>
    </div>
    
    <h2 id="result-text" style="line-height: 1.5;"></h2>

    <!-- MÀN HÌNH POP-UP KẾT QUẢ -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Kết Quả Của Bạn!</h2>
            <h1 id="modal-score">100%</h1>
            <p id="modal-comment" style="font-size: 18px; color: #555;"></p>
        </div>
    </div>

    <!-- CHỮ KÝ TÁC GIẢ -->
    <div style="margin-top: 50px; padding-bottom: 20px; font-size: 16px; color: #888; font-weight: bold; font-style: italic;">
        Made by Peihcouq
    </div>

    <script src="script.js"></script>
</body>
</html>
