<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matching Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Matching Game</h1>

    <!-- BẢNG THÔNG TIN (HUD) -->
    <div class="hud-container">
        <div id="streak-display">🔥 Chuỗi: 0 (Very Easy - Yêu cầu: >= 80%)</div>
        <div id="money-display">💰 Tài khoản: 0 Tỷ VNĐ</div>
    </div>

    <!-- KHÔNG GIAN LÀM VIỆC CHÍNH (Chia 2 cột trên PC) -->
    <div class="game-workspace">
        
        <!-- CỘT TRÁI: Khu vực hiển thị Tên và Ảnh -->
        <div class="left-panel">
            <h2 id="character-name-display">Đang tải nhân vật...</h2>
            
            <div class="image-container">
                <!-- Ảnh đáp án -->
                <div class="box" id="original-box" style="display: none;">
                    <h2>Đáp án chính xác</h2>
                    <img src="" id="target-img" alt="Ảnh gốc">
                </div>

                <!-- Ảnh nhân vật -->
                <div class="box">
                    <h2>Đáp án của bạn</h2>
                    <div id="character-wrapper">
                        <img src="" id="body-img" alt="Thân nhân vật">
                        <img src="" id="shirt-img" alt="Áo nhân vật">
                        <div id="color-overlay"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: Bảng điều khiển & Nút bấm & Kết quả -->
        <div class="right-panel">
            <div class="controls" id="controls-panel">
                <h3>Hãy chọn màu chính xác</h3>

                <div>
                    <label>Chọn Màu Nhanh:</label>
                    <input type="color" id="quick-color" value="#ffffff">
                </div>

                <div>
                    <label>Màu sắc (Hue):</label>
                    <input type="range" id="hue" min="0" max="360" value="0">
                </div>

                <div>
                    <label>Độ rực rỡ (Saturation):</label>
                    <input type="range" id="saturation" min="0" max="100" value="0">
                </div>

                <div>
                    <label>Độ sáng (Brightness):</label>
                    <input type="range" id="brightness" min="0" max="100" value="100">
                </div>
            </div>

            <div class="action-buttons">
                <button id="check-btn">Chấm Điểm</button>
                <button id="next-btn" style="display: none;">Chơi lại</button>
            </div>
            
            <h2 id="result-text"></h2>
        </div>

    </div>

    <!-- MÀN HÌNH POP-UP KẾT QUẢ -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Kết Quả Của Bạn!</h2>
            <h1 id="modal-score">100%</h1>
            <p id="modal-comment" style="font-size: 18px; color: #555;"></p>
        </div>
    </div>

    <div class="footer-signature">made by peihcouq</div>

    <script src="script.js"></script>
</body>
</html>
